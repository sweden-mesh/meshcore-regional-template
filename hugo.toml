# Module configuration and defaults. A region site sets its own values for the
# params below in its hugo.toml (missing keys fall back to these defaults); every
# other file it overrides by putting a file at the same path (content/, layouts/,
# assets/, i18n/, static/). Every key is described in README.md.

[module.hugoVersion]
  min = "0.146.0"

[params]
  style = "product"          # "product" (light, design D; follows the OS dark mode) or "console" (dark, technical)
  noindex = false            # true on staging: robots noindex + a disallow-all robots.txt
  national = false           # true only on the national site (meshcore-swe.se): every county from data/lan/,
                             # a county switch in the browser, county front pages. False emits nothing of it
                             # (scripts/compare-regional.sh proves a regional build unchanged)
  lanData = ""               # national mode: the county-data guide (how to correct a county), linked from county pages

[params.region]
  scb = ""                   # the county's SCB code, e.g. "06": the template then fetches the county's
                             # name and region (scope) from zombiefredrik/meshcore-se-regioner
  name = ""                  # optional: overrides the county name from the list
  short = ""                 # short place name for page titles, e.g. "Jönköping"; empty = name
  iatas = ["XXX"]            # observer IATA codes in the MQTT topics; filters Beacon
  scope = "se"               # optional: overrides the scope from the list ("se" = take it from the list)
  center = [62.0, 16.0]      # map start, [lat, lng]
  zoom = 5                   # map start zoom

[params.firmware]
  picker = "https://sweden-mesh.github.io/firmware/"   # firmware images by board and release
  flasher = "https://meshcore.io/flasher"              # the official web flasher (Web Serial)
  flash = false              # true: the page /flasha/ flashes lou firmware from this site (B-298)
  flashIndex = "https://fw.meshcoresverige.se/"        # where fw/hosted.json and the images are (CORS GET)

[params.observer]
  preset = "meshat.se"       # the Observer firmware's MQTT preset this region's map is fed from

# The map code (IATA) of each county by SCB code, as Beacon lists them (2026-11-14). The wizards
# fill an Observer's mqtt.iata from the county its picked position lies in. A region's own
# params.region.iatas wins for its own county.
[params.observer.iatas]
  "01" = "STO"
  "03" = "STO"
  "04" = "NYO"
  "05" = "LPI"
  "06" = "JKG"
  "07" = "VXO"
  "08" = "KLR"
  "09" = "VBY"
  "10" = "RNB"
  "12" = "MMX"
  "13" = "HAD"
  "14" = "GOT"
  "17" = "KSD"
  "18" = "ORB"
  "19" = "VST"
  "20" = "BLE"
  "21" = "GVX"
  "22" = "SDL"
  "23" = "OSD"
  "24" = "UME"
  "25" = "LLA"

[params.observer.mqtt]       # the region's own MQTT broker; empty server = the wizards don't offer it
  server = ""                # e.g. "wss://mqtt.example.se" (up to 63 characters)
  port = 443
  audience = ""              # JWT audience, usually the host; empty = username/password below
  username = ""              # only a public login: it is printed in the page
  password = ""
  slot = 6                   # which of the Observer's 6 MQTT slots (1-6) the wizard sets; not 3, which
                             # `set mqtt.cmd on` takes first on a board with PSRAM (2 without)

[params.backend]             # the region's command broker: signed remote commands (lou `rc` builds), packets on
  host = "mqtt-meshcore.louie.se"   # the shared broker every region uses by default; a region with its own sets its host
  preset = "mqtt-meshcore.louie.se" # the host lou firmware's compiled `mccontrol` preset names (lou-17 on): a fact
                             # about the firmware, not a setting. host == preset gives the bare `set mqtt.cmd on`
  slot = 3                   # an own broker's command slot (2-6), set by hand; the shared one's slot the firmware picks

[params.naming]
  pattern = ""               # the region's suggested repeater name, e.g. "SE-JKP-Plats"; empty = general advice only
  example = ""               # e.g. "SE-JKP-Braneryd"
  companion_example = ""     # e.g. "SE-JKP-Jeppe"; empty = the repeater example
  explain = ""               # one sentence on the parts

[params.radio]
  preset = "EU/UK (Narrow)"  # the preset's name in the MeshCore app
  freq = 869.618             # MHz
  bw = 62.5                  # kHz
  sf = 8
  cr = 8

[params.map]
  maplibre = "6.16.0"        # vendored under static/lib/maplibre-gl/<version>/ (not vendor/: Go module downloads drop vendor directories)
  style_light = "https://tiles.openfreemap.org/styles/liberty"
  style_dark = "https://tiles.openfreemap.org/styles/dark"
  companions = false         # true = also show companion nodes (handsets); their positions can be homes

[params.beacon]
  url = "https://beacon.meshcoresverige.se"   # the shared national Beacon by default; a region may run its own; "" = no live data
  # links = "…"              # the map's link colours from one file (Beacon's /static/neighbors.json shape), or one per IATA
                             # when it holds {iata} (a 404 there = no links yet); "" = one request per node instead. Unset:
                             # <url>/static/neighbors/{iata}.json, then <url>/static/neighbors.json, when url is in links_from.
                             # A failed file falls back to the per-node requests.
  links_from = ["https://beacon.meshcoresverige.se", "https://beacon.meshcore-jkp.se"]

# MeshMapper (README "MeshMapper coverage"): a link to the region's map, and its measured coverage as a map
# layer, fetched at build time when coverage = true and HUGO_MESHMAPPER_KEY is set (the key decides the region).
[params.meshmapper]
  coverage = false           # true = the coverage layer (needs the key, or a fixture, and the region's permission)
  url = ""                   # the region's MeshMapper map, e.g. https://jkg.meshmapper.net/; empty = no link
  days = 180                 # only pings from the last N days
  fixture = ""               # a saved coverage response under the site's assets, read instead of the API (tests)
  sites = false              # true = antenna, height and power source in the node popups (get_repeaters.php at url; needs the key)
  sites_fixture = ""         # a saved get_repeaters.php response under the site's assets, read instead of the API (tests)

# The contributors list ({{< contributors >}}, backlog B-258): the GitHub contributors of these repos,
# read at build time, with bots and AI agents filtered (data/contributor_deny.toml + deny). people
# lists work done outside git (name, what, optional url); exclude leaves out anyone who asks.
[params.contributors]
  repos = ["sweden-mesh/meshcore-regional-template"]
  deny = []
  exclude = []

[params.regionSwitch]          # B-312: a county button in the header listing every county's site
  on = false                 # (data/county_sites.toml); regional mode only, national has its own
  national = ""              # empty = the list's national site

[params.community]
  name = ""                  # the local group, e.g. JKPG-Mesh
  url = ""
  hero = false               # true: also a button beside "Se kartan" on the front page

[params.chat]
  discord = ""               # invite URL (shown as "Discord")
  matrix = ""                # room URL, e.g. https://matrix.to/#/#room:server

# More chat links with their own names, e.g. a national server beside the local one:
# [[params.chats]]
#   name = "Sweden Mesh Discord"
#   url = "https://discord.gg/…"

# The region's channels, shown on the landing page and in the channel guide.
# [[params.channels]]
#   name = "#test-xxx"
#   scope = "se-xxx"          # the region the channel's messages carry; empty = none
#   purpose = "Testmeddelanden; repeatrar med auto-svar svarar"
#   note = "Testa här, inte i chattkanalerna"   # optional

[params.analytics]
  plausible = false          # true = load Plausible (cookieless) through the paths below
  script = ""                # same-origin path to the site's Plausible script (pa-<id>.js, proxied), e.g. /p/x7k2.js
  api = ""                   # same-origin event endpoint (proxied), e.g. /p/event
