# Module configuration and defaults. A region site sets its own values for the
# params below in its hugo.toml (missing keys fall back to these defaults); every
# other file it overrides by putting a file at the same path (content/, layouts/,
# assets/, i18n/, static/). Every key is described in README.md.

[module.hugoVersion]
  min = "0.146.0"

[params]
  style = "product"          # "product" (light, design D; follows the OS dark mode) or "console" (dark, technical)
  noindex = false            # true on staging: robots noindex + a disallow-all robots.txt

[params.region]
  scb = ""                   # the county's SCB code, e.g. "06": the template then fetches the county's
                             # name and region (scope) from zombiefredrik/meshcore-se-regioner
  name = ""                  # optional: overrides the county name from the list
  short = ""                 # short place name for page titles, e.g. "Jönköping"; empty = name
  iatas = ["XXX"]            # observer IATA codes in the MQTT topics; filters Beacon
  scope = "se"               # optional: overrides the scope from the list ("se" = take it from the list)
  center = [62.0, 16.0]      # map start, [lat, lng]
  zoom = 5                   # map start zoom

[params.firmware]
  picker = "https://sweden-mesh.github.io/firmware/"   # firmware images by board and release
  flasher = "https://meshcore.io/flasher"              # the official web flasher (Web Serial)

[params.observer]
  preset = "meshat.se"       # the Observer firmware's MQTT preset this region's map is fed from

[params.observer.mqtt]       # the region's own MQTT broker; empty server = the wizards don't offer it
  server = ""                # e.g. "wss://mqtt.example.se" (up to 63 characters)
  port = 443
  audience = ""              # JWT audience, usually the host; empty = username/password below
  username = ""              # only a public login: it is printed in the page
  password = ""
  slot = 3                   # which of the Observer's 6 MQTT slots (1-6) the wizard sets

[params.naming]
  pattern = ""               # the region's naming rule, e.g. "SE-JKP-Plats-ABCD"; empty = general advice only
  example = ""               # e.g. "SE-JKP-Braneryd-FD70"
  companion_example = ""     # e.g. "SE-JKP-Jeppe"; empty = the repeater example
  explain = ""               # one sentence on the parts

[params.radio]
  preset = "EU/UK (Narrow)"  # the preset's name in the MeshCore app
  freq = 869.618             # MHz
  bw = 62.5                  # kHz
  sf = 8
  cr = 8

[params.map]
  maplibre = "6.16.0"        # vendored under static/lib/maplibre-gl/<version>/ (not vendor/: Go module downloads drop vendor directories)
  style_light = "https://tiles.openfreemap.org/styles/liberty"
  style_dark = "https://tiles.openfreemap.org/styles/dark"
  companions = false         # true = also show companion nodes (handsets); their positions can be homes

[params.beacon]
  url = ""                   # Beacon base URL, e.g. https://beacon.example.se; empty = no live data

[params.community]
  name = ""                  # the local group, e.g. JKPG-Mesh
  url = ""

[params.chat]
  discord = ""               # invite URL (shown as "Discord")
  matrix = ""                # room URL, e.g. https://matrix.to/#/#room:server

# More chat links with their own names, e.g. a national server beside the local one:
# [[params.chats]]
#   name = "Sweden Mesh Discord"
#   url = "https://discord.gg/…"

# The region's channels, shown on the landing page and in the channel guide.
# [[params.channels]]
#   name = "#test-xxx"
#   scope = "se-xxx"          # the region the channel's messages carry; empty = none
#   purpose = "Testmeddelanden; repeatrar med auto-svar svarar"
#   note = "Testa här, inte i chattkanalerna"   # optional

[params.analytics]
  plausible = false          # true = load Plausible (cookieless) through the paths below
  script = ""                # same-origin path to the site's Plausible script (pa-<id>.js, proxied), e.g. /p/x7k2.js
  api = ""                   # same-origin event endpoint (proxied), e.g. /p/event
