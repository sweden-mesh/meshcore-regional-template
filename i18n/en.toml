[wzg_name_why]
other = "The name is what others see in their lists and on the map. A place name says where the repeater stands, so others understand which parts of the mesh it joins."
[wzg_radio]
other = "Radio"
[wzg_radio_why]
other = "Everyone who is to hear each other must have exactly the same frequency, bandwidth, spreading factor and coding rate. A repeater with other values hears no one and is heard by no one."
[wzg_tx]
other = "Transmit power in dBm (optional)"
[wzg_tx_why]
other = "Leave empty for the radio's default. More power helps less than a higher site; only enter a value your radio and antenna can take and that is allowed."
[wzg_place_why]
other = "A repeater's position is good to share: it doesn't move, and it shows on the map where the mesh reaches. Click where the antenna will be. If you would rather not show exactly where you live, a click within 200–300 metres is enough, but no further: a position too far off gives a misleading picture of where the mesh reaches."
[wzg_region_why]
other = "The regions decide which traffic the repeater passes on. With se and the county's region, local conversations reach the whole county and national ones the whole country, without local traffic flooding the neighbouring counties."
[wzg_edge_why]
other = "A repeater near the county border also gets the neighbouring county's region, so traffic between the counties gets through. If it can't reach the neighbouring county's repeaters, untick it."
[wzg_duty]
other = "Duty cycle"
[wzg_duty_why]
other = "Duty cycle is the share of time the repeater may transmit. In the 869.4–869.65 MHz band, where 869.618 MHz lies, at most 10 percent is a requirement throughout the EU, and it applies to every transmitter, a repeater too. The limit also protects the mesh: while a repeater transmits, the neighbours that hear it cannot transmit themselves, and when two transmit at once the packets collide. A repeater that transmits too much drowns out the repeaters around it, and their traffic does not get through. 10 is the ceiling, not a target: never set it higher."
[wzg_pass_why]
other = "The admin password lets you change the repeater, even remotely over the radio. Change it, write it down and share it only with whoever will look after the repeater."
