[wz_quick_title]
other = "Quick repeater setup"
[wz_quick_desc]
other = "Choose a place and a name, and the page sends the rest of the settings to your repeater over USB."
[wz_quick_intro]
other = "Four choices, then the page sends the settings to the radio over USB. Everything else gets the region's defaults. To understand each value, take the [guided setup](../repeater-guidad/)."
[wz_guided_title]
other = "Guided repeater setup"
[wz_guided_desc]
other = "Step by step through each setting, with explanations, until your repeater is ready to mount."
[wz_guided_intro]
other = "This guide takes one setting at a time and explains why it is the way it is. If you have done it before, the [quick setup](../repeater-snabb/) is faster."
[wz_comp_title]
other = "Set up a companion"
[wz_comp_desc]
other = "The values to enter in the MeshCore app for a companion in the region, step by step."
[wz_comp_intro]
other = "A companion is set up in the MeshCore app, not over the USB console. Here are the region's values in the order the app asks for them. If you haven't flashed the radio yet, start with [Flash firmware](../../guider/flasha-firmware/) and choose *companion*."
[wzc_1]
other = "Connect the app"
[wzc_1_text]
other = "Connect the app to the radio over Bluetooth, or USB for a USB companion. If the radio has a screen the PIN is shown there; otherwise it is often 123456."
[wzc_2]
other = "Radio settings"
[wzc_2_text]
other = "Choose the preset, or fill in the values by hand:"
[wzc_3_text]
other = "Short, recognisable and without giving away more than you want. Under 22 bytes leaves room for the position in the same advert."
[wzc_4_text]
other = "Optional for a companion. It goes where you go, so a shared position can show where you live. The map on this site doesn't show companions."
[wzc_5_text]
other = "Add the region's channels with exactly the same names. For local conversations, set the channel's region to"
[wzc_6]
other = "Test"
[wzc_6_text]
