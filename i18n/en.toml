[about_meshcore_title]
other = "What is MeshCore?"
[about_meshcore]
other = """MeshCore is free software for small LoRa radios. The radios send short text messages to each other without a mobile network and without the internet. When a message can't get through directly, repeaters pass it on, one hop at a time, often for tens of kilometres.

The mesh is built by the people who use it. Someone puts a repeater on a roof or a mast, someone else carries a companion and writes from the MeshCore app on their phone. No one owns the mesh, and there is no central server that can go down.

All you need to start is a radio and the app. [Read more about MeshCore]({{ .Guide }})."""
