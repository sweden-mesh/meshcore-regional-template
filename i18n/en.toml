[wzg_guest_why]
other = "Whoever logs in as a guest can read the repeater's status (battery, noise floor, packet counts), basic telemetry and which neighbours it hears, but cannot change anything. That makes guest access a good way for others to troubleshoot the mesh, and letting others log in as a guest is considered safe. By default the guest password is empty, and then anyone can log in as a guest without a password. To limit it, type your own here and share it with whoever you like. Leave the field empty to change nothing."
