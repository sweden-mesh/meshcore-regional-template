[sol_n_cells]
other = "**At least two cells**, or a charger set to at most 1.5 A: the guide's charger gives up to 2 A, and Biltema's cell takes 1.5 A. The cells have no protection of their own, so the pack needs a **protection board**. Use cells from one purchase, charged to the same voltage before joining them."
[sol_n_cold]
