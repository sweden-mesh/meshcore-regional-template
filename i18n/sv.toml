[wizards]
other = "Guidade inställningar"
[wz_quick_title]
other = "Snabbkonfiguration av repeater"
[wz_quick_desc]
other = "Välj plats och namn, så skickar sidan resten av inställningarna till din repeater via USB."
[wz_quick_intro]
other = "Fyra val, sedan skickar sidan inställningarna till radion via USB. Allt annat får regionens standardvärden. Vill du förstå varje värde, ta den [guidade installationen](../repeater-guidad/)."
[wz_guided_title]
other = "Guidad installation av repeater"
[wz_guided_desc]
other = "Steg för steg genom varje inställning, med förklaringar, tills din repeater är klar att monteras."
[wz_guided_intro]
other = "Den här guiden tar en inställning i taget och förklarar varför den är som den är. Har du gjort det förut går [snabbkonfigurationen](../repeater-snabb/) fortare."
[wz_comp_title]
other = "Ställ in en companion"
[wz_comp_desc]
other = "Värdena att fylla i i MeshCore-appen för en companion i regionen, steg för steg."
[wz_comp_intro]
other = "En companion ställs in i MeshCore-appen, inte via USB-konsolen. Här är regionens värden i den ordning appen frågar efter dem. Har du inte flashat radion än, börja med [Flasha firmware](../../guider/flasha-firmware/) och välj *companion*."
[wzc_1]
other = "Anslut appen"
[wzc_1_text]
other = "Anslut appen till radion via Bluetooth, eller USB för en USB-companion. Har radion en skärm står PIN-koden där; annars är den ofta 123456."
[wzc_2]
other = "Radioinställningar"
[wzc_2_text]
other = "Välj förinställningen, eller fyll i värdena för hand:"
[wzc_3_text]
other = "Kort, igenkännbart och utan att avslöja mer än du vill. Under 22 byte får positionen plats i samma advert."
[wzc_4_text]
other = "Frivillig för en companion. Den följer med dig, så en delad position kan visa var du bor. Kartan på den här sidan visar inte companions."
[wzc_5_text]
other = "Lägg till regionens kanaler med exakt samma namn. För lokala samtal, sätt kanalens region till"
[wzc_6]
other = "Testa"
[wzc_6_text]
other = "Skicka en advert från appen och skriv test i testkanalen. Repeatrar med auto-svar svarar, och du ser vilka som hörde dig."
[search_noscript]
other = "Sökningen behöver JavaScript."
