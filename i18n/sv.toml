[wz_comp_intro]
other = "En companion ställs in i MeshCore-appen, inte via USB-konsolen. Här är regionens värden i den ordning appen frågar efter dem. Har du inte flashat radion än, börja med [Flasha firmware](../../guider/flasha-firmware/#companion): companion-firmware finns i MeshCore-projektets webbflasher."
