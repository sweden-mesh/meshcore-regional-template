[wzg_test_why]
other = "Kontrollera att repeatern fungerar medan du fortfarande når den, innan den monteras på tak eller i mast."
[wzg_test_1]
other = "Låt den stå på några minuter efter omstarten, med antennen på."
[wzg_test_2]
other = "Anslut igen och se vilka repeatrar den hört med kommandot"
[wzg_test_3]
