[wzg_name_why]
other = "Namnet är det andra ser i sina listor och på kartan. Ett platsnamn säger var repeatern står, så att andra förstår vilka delar av nätet den knyter ihop."
[wzg_radio]
other = "Radio"
[wzg_radio_why]
other = "Alla som ska höra varandra måste ha exakt samma frekvens, bandbredd, spreading factor och coding rate. En repeater med andra värden hör ingen och hörs inte av någon."
[wzg_tx]
other = "Sändeffekt i dBm (valfritt)"
[wzg_tx_why]
other = "Lämna tomt för radions standard. Högre effekt hjälper mindre än en högre placering; ange bara ett värde som din radio och antenn klarar och som är tillåtet."
[wzg_place_why]
other = "En repeaters position är bra att dela: den står still, och den visar på kartan var nätet når. Klicka där antennen ska sitta. Vill du inte visa exakt var du bor räcker det att klicka inom 200–300 meter, men inte längre bort än så: en position för långt ifrån ger en missvisande bild av var nätet når."
[wzg_region_why]
other = "Regionerna avgör vilken trafik repeatern för vidare. Med se och länets region når lokala samtal hela länet och rikssamtal hela landet, utan att lokal trafik floodas över grannlänen."
[wzg_edge_why]
other = "En repeater nära länsgränsen får grannlänets region också, så att trafik mellan länen kommer fram. Står den inte så att den når grannlänets repeatrar kan du ta bort bocken."
[wzg_duty]
other = "Duty cycle"
[wzg_duty_why]
other = "Duty cycle är hur stor del av tiden repeatern får sända. I bandet 869,4–869,65 MHz, där 869,618 MHz ligger, är högst 10 procent ett krav i hela EU (i Sverige genom PTS föreskrifter), och det gäller varje sändare, även en repeater. Gränsen skyddar också nätet: medan en repeater sänder kan grannarna som hör den inte sända själva, och sänder två samtidigt krockar paketen. En repeater som sänder för mycket dränker alltså repeatrarna runt sig, och deras trafik når inte fram. 10 är taket, inte ett mål: sätt den aldrig högre."
[wzg_pass_why]
other = "Med administratörslösenordet kan man ändra inställningar i repeatern, även på distans via radio. Byt det, skriv upp det och dela det bara med den som ska sköta repeatern."
