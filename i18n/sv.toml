[wzg_guest_label]
other = "Gästlösenord (valfritt)"
[wzg_guest_why]
other = "Den som loggar in som gäst kan läsa repeaterns status (batteri, brusnivå, antal paket), grundläggande mätvärden och vilka grannar den hör, men inte ändra något. Det gör gäståtkomst till ett bra sätt för andra att felsöka nätet, och det räknas som säkert att låta andra logga in som gäst. Som standard är gästlösenordet tomt, och då kan vem som helst logga in som gäst utan lösenord. Vill du begränsa det skriver du ett eget här och delar det med dem du vill. Lämna fältet tomt så ändras inget."
[wz_f_guest]
other = "gästlösenord"
[wzg_test_4]
other = "**Syns den inte?** Ställ dig nära repeatern med en **companion** och skicka en *flood-advert* från appen. Repeatern skickar den vidare, och repeatrarna runt omkring hör då din nya repeater och lägger till den bland sina grannar. Är din repeater ingen observatör syns den på kartan först när en observatör hör den: det den skickar vidare låter observatörerna i närheten upptäcka den."
