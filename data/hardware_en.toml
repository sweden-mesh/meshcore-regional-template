# English version of data/hardware.toml (B-337): same rows, keys and order; only the text is translated.
# Collected 2026-11-18 from the makers' own pages and datasheets, the MeshCore FAQ, the official
# flasher's device list (https://flasher.meshcore.io/config.json) and one named review. Every
# figure, pro, con and warning comes from the row's sources; a field without a source is left out.
# url is the maker's own product, store or documentation page (no shops, no affiliate links).
# Prices: Swedish shops in November 2026 where found, else a European or the maker's price; they change.
# Pictures only with a licence that allows reuse (today: Seeed's wiki images, CC BY-SA 4.0), downloaded
# to assets/images/hardware/ and credited by {{< hw-credits >}}:
#   image = { file, source (the page it was shown on), by, licence, licenceUrl, date }.
# Or, for the makers' press images the site operator supplied (operator 2026-11-18; no credit line):
#   image = { file, alt (English here) }.

