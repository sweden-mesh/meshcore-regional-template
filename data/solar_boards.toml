# The solar calculator's boards (B-291, operator 2026-11-17: option B, a board list on a load grid).
# Each board's average current as a repeater, per firmware, at the battery, in mA, from a source
# the method page names (B.2): `ma` is the sourced figure, `grid` the load it is rounded UP to
# (reference_solar_need.LOAD_GRID_MA), so a board never gets a smaller battery than its source
# supports. No entry for a firmware = no figure found, and that choice is greyed out for the board.
# `low = true`: no PPK2 average exists, the figure is the upper end of a multimeter range or a
# `powersaving on` reading (lower confidence). Images: assets/solar/boards/<img>.svg.

[[board]]
  key = "xiao-nrf52840"
  name = "Seeed XIAO nRF52840 med Wio-SX1262"
  family = "nRF52"
  img = "xiao-nrf52840"
  esm = { ma = 4.5, grid = "4.5", src = "S1" }
  official = { ma = 7.1, grid = "7.1", src = "S1" }
