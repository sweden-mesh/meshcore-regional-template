# Battery sizing for a solar repeater, per region map code (operator 2026-11-14). Copied unchanged
# from the "Solar meshcore repeater battery sizing" session's solar.toml (sha256 66f16a36…0391,
# 2026-11-14), with two fields added per region by us: source (the PVGIS dataset) and, for the
# northern counties, note (that session's caveats, in Swedish). Never scaled or interpolated here.
# Solar battery sizing per county for MeshCore repeaters on the Clas Ohlson panel.
# Same model and assumptions as the Jönköping guide: CN3791 at 5.6 V, XIAO nRF52840 + Wio-SX1262,
# EasySkyMesh 4.5 mA / official MeshCore 7.1 mA, PVGIS 2005-2023, worst winter in five + 20 %.
# All battery values are nominal mAh rounded to 100, NOT floored: apply the 3 000 mAh practical floor when displaying.
# capacity.trees / pessimistic / official = highest tree line (deg) survived; 0 = open horizon only; -1 = not even an open horizon.
# LLA (Norrbotten) uses PVGIS-ERA5 (outside SARAH3 coverage); all other points use PVGIS-SARAH3.

