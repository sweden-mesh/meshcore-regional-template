# Battery sizing for a solar repeater, per region map code (operator 2026-11-14). From the
# hour-by-hour simulation of the "Solar meshcore repeater battery sizing" session: PVGIS v5.3
# SARAH3 2005-2023, the Clas Ohlson panel gutted, CN3791 at 5.6 V, XIAO nRF52840 + Wio-SX1262,
# EasySkyMesh 4.5 mA / official MeshCore 7.1 mA, worst winter in five + 20 %. Never scaled or
# interpolated here: a region without its own entry is shown Jönköping's numbers, labelled so.
# Values are mAh; ranges are [low, high] of the uncertainty.

[JKG]
place = "Jönköping"
lat = 57.78
lon = 14.16
# kWh/m² per day on a vertical south panel, Jan..Dec
irradiation = [0.86, 1.70, 3.06, 3.67, 3.32, 3.25, 3.12, 2.97, 2.78, 1.99, 0.90, 0.62]
dec_of_june = 19

  # tree line (degrees) → [vertical, 60° tilt, 40° tilt] each as [value, low, high], and official firmware vertical
  [[JKG.trees]]
