# A minimal region site. A real region copies this directory into its own
# repository, deletes the [module] replacements line and runs `hugo mod get`.
baseURL = "https://example.org/"
title = "MeshCore Exempelregionen"
locale = "sv"
defaultContentLanguage = "sv"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[module]
  # Local development only: use the template from the parent directory.
  replacements = "github.com/sweden-mesh/meshcore-regional-template -> ../.."
  [[module.imports]]
    path = "github.com/sweden-mesh/meshcore-regional-template"

[params.region]
  scb = "06"
  name = "Exempelregionen"
  iatas = ["XXX"]
  scope = "se-xxx"
  center = [57.78, 14.16]
  zoom = 9

[params.naming]
  pattern = "SE-XXX-Plats"
  example = "SE-XXX-Utsikten"
  companion_example = "Kim"
  explain = "SE för Sverige, regionens kod och en välkänd plats. Står flera repeatrar på samma plats läggs de fyra första tecknen i nodens nyckel till, så att namnen inte krockar."

[params.beacon]
  url = ""
  # Other Beacons that have heard the region longer; their nodes fill the map until ours
  # has heard them. Example: seeds = ["https://beacon.meshat.se"]
  seeds = []

[params.community]
  name = "Exempel-Mesh"
  url = "https://example.org/"

[params.chat]
  discord = "https://discord.gg/example"

[[params.channels]]
  name = "#test-xxx"
  scope = "se-xxx"
  purpose = "Skriv `test` så svarar repeatrar med auto-svar"
  note = "Testa här, inte i chattkanalerna"

[[menus.main]]
  name = "Guider"
  pageRef = "/guider"
  weight = 10
[[menus.main]]
  name = "Wizards"
  pageRef = "/wizard"
  weight = 15
[[menus.main]]
  name = "Felsökning"
  pageRef = "/felsokning"
  weight = 17
[[menus.main]]
  name = "Frågor"
  pageRef = "/fragor"
  weight = 18
[[menus.main]]
  name = "Om regionen"
  pageRef = "/om-regionen"
  weight = 20

[params.observer.mqtt]
  server = "wss://mqtt.example.org"
  audience = "mqtt.example.org"
  slot = 3
