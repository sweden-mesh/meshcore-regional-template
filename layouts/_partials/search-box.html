{{- /* The search box's markup and data (B-321), one copy per site (partialCached): the /sok/ page
  shows it, the header keeps it in a <template> for the search dialog (UX-SV-5). Ids get the
  prefix given: partial "search-box.html" (dict "id" "search") */ -}}
{{- $r := partialCached "region.html" . "region" -}}
{{- $pairs := dict -}}
{{- range site.Pages -}}
  {{- $s := partial "search-scope.html" . -}}
  {{- if and .Params.searchPair (hasPrefix $s "region:") -}}
    {{- $pairs = merge $pairs (dict $s (union (index $pairs $s | default slice) (slice .Params.searchPair))) -}}
  {{- end -}}
{{- end -}}
{{- $counties := dict -}}
{{- if site.Params.national }}{{ range partialCached "lan.html" . "lan" }}{{ $counties = merge $counties (dict .scb .scope) }}{{ end }}{{ end -}}
<div class="search-box" role="search" id="{{ $.id }}" data-bundle="{{ "pagefind/" | relURL }}"
      data-region="{{ if site.Params.national }}{{ else }}region:{{ $r.scope }}{{ end }}" data-national="{{ site.Params.national | default false }}"
      data-counties="{{ $counties | jsonify }}" data-pairs="{{ $pairs | jsonify }}"
      data-texts="{{ dict "none" (T "search_none") "count" (T "search_count") "missing" (T "search_missing") | jsonify }}">
  <label for="{{ $.id }}-q" class="visually-hidden">{{ T "search_label" }}</label>
  <input type="search" id="{{ $.id }}-q" autocomplete="off" placeholder="{{ T "search_label" }}" disabled>
  <p class="search-status muted" aria-live="polite"></p>
  <ol class="search-results"></ol>
  <noscript>{{ T "search_noscript" }}</noscript>
</div>
