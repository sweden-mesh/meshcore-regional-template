<header class="site-header">
  <a class="brand" href="{{ "/" | relURL }}">
    {{- with resources.Get "images/logo.svg" }}<img class="brand-logo" src="{{ (. | minify | fingerprint).RelPermalink }}" alt="" width="32" height="32">{{ end -}}
    <span>{{ site.Title }}</span>
  </a>
  <nav>{{ range site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}</nav>
</header>
