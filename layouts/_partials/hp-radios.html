{{- /* Radio buttons for the host wizard: dict name, label, opts (slice of [value, text]). */ -}}
<fieldset class="wz-q"><legend class="sol-label">{{ .label }}</legend>
{{- range .opts }}
<label class="wz-check"><input type="radio" name="hp-{{ $.name }}" value="{{ index . 0 }}"> <span>{{ index . 1 }}</span></label>
{{- end }}
</fieldset>
