{{ define "main" }}
  <article class="content page page-wide">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="page-lead">{{ . }}</p>{{ end }}
    {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
    <ol class="guide-grid">
      {{ range $i, $p := .Pages.ByWeight }}
        <li><a href="{{ .RelPermalink }}"><span class="eyebrow">{{ printf "%02d" (add $i 1) }}</span><strong>{{ .Title }}</strong>{{ with .Description }}<span class="muted">{{ . }}</span>{{ end }}</a></li>
      {{ end }}
    </ol>
  </article>
{{ end }}
